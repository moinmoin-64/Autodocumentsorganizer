apiVersion: v2
name: organisationsai
description: A Helm chart for OrganisationsAI - Intelligent Document Organization System
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - document-management
  - ocr
  - email-integration
  - ai

home: https://github.com/moinmoin-64/Autodocumentsorganizer
sources:
  - https://github.com/moinmoin-64/Autodocumentsorganizer

maintainers:
  - name: Development Team
    email: dev@organisationsai.example.com

dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
