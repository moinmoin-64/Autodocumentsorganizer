apiVersion: v1
kind: ConfigMap
metadata:
  name: organisationsai-config
  namespace: organisationsai
data:
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"
  MAX_UPLOAD_SIZE: "104857600"
  CACHE_TTL: "3600"
  OCR_CONFIDENCE_THRESHOLD: "0.7"

---
apiVersion: v1
kind: Secret
metadata:
  name: organisationsai-secrets
  namespace: organisationsai
type: Opaque
stringData:
  SECRET_KEY: "" # Set via helm values or kubectl
  DATABASE_URL: "" # postgresql://...
  REDIS_URL: "redis://organisationsai-redis:6379/0"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organisationsai
  namespace: organisationsai
  labels:
    app: organisationsai
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: organisationsai
  template:
    metadata:
      labels:
        app: organisationsai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: organisationsai
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
      - name: db-migrate
        image: organisationsai:latest
        command: ["flask", "db", "upgrade"]
        env:
        - name: FLASK_APP
          value: main.py
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: organisationsai-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      
      containers:
      - name: organisationsai
        image: organisationsai:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        - name: metrics
          containerPort: 8000
          protocol: TCP
        
        env:
        - name: FLASK_ENV
          valueFrom:
            configMapKeyRef:
              name: organisationsai-config
              key: FLASK_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: organisationsai-config
              key: LOG_LEVEL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: organisationsai-secrets
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: organisationsai-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: organisationsai-secrets
              key: REDIS_URL
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        - name: uploads
          mountPath: /app/uploads
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: uploads
        persistentVolumeClaim:
          claimName: organisationsai-uploads

---
apiVersion: v1
kind: Service
metadata:
  name: organisationsai
  namespace: organisationsai
  labels:
    app: organisationsai
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 8000
    targetPort: metrics
    protocol: TCP
  selector:
    app: organisationsai

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: organisationsai
  namespace: organisationsai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: organisationsai
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: organisationsai
  namespace: organisationsai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: organisationsai

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: organisationsai-uploads
  namespace: organisationsai
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 100Gi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: organisationsai
  namespace: organisationsai
spec:
  podSelector:
    matchLabels:
      app: organisationsai
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: organisationsai
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: organisationsai
  namespace: organisationsai

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: organisationsai
  namespace: organisationsai
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: organisationsai
  namespace: organisationsai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: organisationsai
subjects:
- kind: ServiceAccount
  name: organisationsai
  namespace: organisationsai
