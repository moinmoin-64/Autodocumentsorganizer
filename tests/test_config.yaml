
system:
  storage:
    base_path: "C:/Users/olist/AppData/Local/Temp/tmpkmj3eipw/storage"
    data_path: "C:/Users/olist/AppData/Local/Temp/tmpkmj3eipw/data"
    structure_file: "C:/Users/olist/AppData/Local/Temp/tmpkmj3eipw/structure.json"
    upload_folder: "C:/Users/olist/AppData/Local/Temp/tmpkmj3eipw/uploads"

email:
  enabled: true
  imap:
    host: "imap.gmail.com"
    port: 993
    username: "test@gmail.com"
    password: "test_password"
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "test@gmail.com"
    password: "test_password"
  inbox_folder: "INBOX"
  archive_folder: "Archive"
  error_folder: "Errors"
  check_interval: 300

web:
  host: "0.0.0.0"
  port: 5000
  debug: true
  secret_key: "test_secret"

auth:
  enabled: true
  users:
    admin: "admin123"

database:
  path: "C:/Users/olist/AppData/Local/Temp/tmpkmj3eipw/test.db"

ocr:
  engine: "tesseract"
  languages: ["deu", "eng"]

ai:
  categorization:
    enabled: true  # AI aktiviert
    model: "paraphrase-multilingual-MiniLM-L12-v2"
    confidence_threshold: 0.6
    
categories:
  main:
    - Rechnungen
    - Versicherungen
    - Verträge
    - Sonstiges
  keywords:
    Rechnungen:
      - rechnung
      - invoice
      - strom
    Versicherungen:
      - versicherung
      - police
    Verträge:
      - vertrag
      - contract

data_extraction:
  Rechnungen:
    fields:
      - name: "betrag"
        type: "currency"
        patterns:
          - 'Betrag:\s*([\d,.]+)\s*EUR'
      - name: "rechnungsnummer"
        type: "text"
        patterns:
          - 'Rechnungs-Nr:\s*([\w-]+)'
  Versicherungen:
    fields:
      - name: "police_nr"
        type: "text"
        patterns:
          - 'Police-Nr:\s*([\w-]+)'
